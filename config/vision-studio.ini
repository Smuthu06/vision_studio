; ============================================================================
;  Vision Studio configuration
;
;  Keep this file next to the program: VisionStudio.exe reads VisionStudio.ini
;  (same name, .ini extension) from its own folder. Restart Vision Studio after
;  editing. Lines starting with ; or # are comments.
;
;  Command-line options override this file, e.g.:
;    VisionStudio.exe --mode web --port 9000
;    VisionStudio.exe --mode web --no-browser
;    VisionStudio.exe --config D:\bench\vision-studio.ini
; ============================================================================

[app]
; How Vision Studio runs:
;   desktop - opens the editor in its own window with native Open/Save dialogs.
;   web     - runs a small local web server and opens the editor in your
;             browser. A tray icon (bottom-right of the taskbar) lets you
;             reopen the page or quit.
mode = desktop

; File with the editor's dropdown lists (File > Settings in Vision Studio).
; Relative paths are resolved against this INI file's folder. A shared network
; path, e.g. \\bench-server\vision\ui_config.json, gives every PC the same lists.
ui_config = ui_config.json

; Folder where File > Save writes the configurations. The file name comes from
; the project: <Project Name>_v<version>.json, e.g. sample_v1.0.0.json for
; project "sample", version V.1.0.0. Relative paths are resolved against this
; INI file's folder; the folder is created on the first save.
project_dir = ../../configurations/project_configuration

; Folder where File > Save writes tester configurations
; (<Tester Name>_v<version>.json).
tester_dir = ../../configurations/tester_configuration

; Folders the tester configuration picks files from (read only):
;   bitfile_dir     FPGA bit files (*.lvbitx) for Camera Model > Bit File
;   datalogger_dir  datalogger configurations (*.json) for Camera Model >
;                   Datalogger Configuration
;   i2c_dir         I2C initialisation files (*.txt) for Channel >
;                   I2C Initialisation File
bitfile_dir = ../../fpga_bitfile
datalogger_dir = ../../datalogger_configuration
i2c_dir = ../../configurations/i2c_configuration

[desktop]
; Initial window size in pixels (minimum 980 x 620).
width = 1440
height = 900
; Start maximised: true / false
maximized = false

[web]
; Address the web server listens on:
;   127.0.0.1 - only this PC can open the editor (recommended).
;   0.0.0.0   - other PCs on the network can open http://<this-pc>:<port>/
;               Allow the port in Windows Defender Firewall. Browsers on other
;               PCs save configurations by downloading the JSON file.
host = 127.0.0.1
; TCP port (1-65535). Choose another one if 8080 is already in use.
port = 8080
; Open the default browser automatically when Vision Studio starts: true / false
open_browser = true
