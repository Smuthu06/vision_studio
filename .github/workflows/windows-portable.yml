# Runs build-windows.bat on a real Windows machine and publishes the portable
# VisionStudio.exe + VisionStudio.ini as a downloadable artifact.
name: windows-portable
on:
  push:
    branches: ["**"]
    paths:
      - "build-windows.bat"
      - "config/**"
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Rust unit tests (INI parsing, web server paths)
        working-directory: src-tauri
        run: cargo test --lib
      - name: build-windows.bat
        shell: cmd
        run: build-windows.bat nopause
      - name: Smoke test web mode
        shell: pwsh
        run: |
          $exe = "release/VisionStudio/VisionStudio.exe"
          $p = Start-Process $exe -ArgumentList "--mode","web","--port","18080","--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:18080/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200 -and $r.Content -match "Vision Studio") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "web mode did not serve the UI" }
          Write-Host "web mode served the UI"
          # dropdown lists API: readable, saveable from this PC, conflict-checked
          $f = Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config"
          if (-not $f.canSave -or -not $f.text) { Stop-Process -Id $p.Id -Force; throw "ui_config.json not served as editable" }
          $body = @{ text = $f.text; baseModified = $f.modified } | ConvertTo-Json
          $s = Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config" -Method Put -Body $body -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }
          $stale = @{ text = $f.text; baseModified = 1 } | ConvertTo-Json
          try { Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config" -Method Put -Body $stale -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }; $conflict = $false }
          catch { $conflict = $_.Exception.Response.StatusCode.value__ -eq 409 }
          Stop-Process -Id $p.Id -Force
          if (-not $conflict) { throw "stale save was not rejected" }
          Write-Host "ui_config API ok ($($s.path))"
      - uses: actions/upload-artifact@v4
        with:
          name: VisionStudio-portable
          path: |
            release/VisionStudio/VisionStudio.exe
            release/VisionStudio/VisionStudio.ini
            release/VisionStudio/ui_config.json
            release/VisionStudio/README.txt
