# Runs build-windows.bat on a real Windows machine and publishes the portable
# VisionStudio.exe + VisionStudio.ini as a downloadable artifact.
name: windows-portable
on:
  push:
    branches: ["**"]
    paths:
      - "build-windows.bat"
      - "config/**"
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Rust unit tests (INI parsing, web server paths)
        working-directory: src-tauri
        run: cargo test --lib
      - name: build-windows.bat
        shell: cmd
        run: build-windows.bat nopause
      - name: Smoke test web mode
        shell: pwsh
        run: |
          $exe = "release/VisionStudio/VisionStudio.exe"
          $p = Start-Process $exe -ArgumentList "--mode","web","--port","18080","--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:18080/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200 -and $r.Content -match "Vision Studio") { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "web mode did not serve the UI" }
          Write-Host "web mode served the UI"
          # dropdown lists API: readable, saveable from this PC, conflict-checked
          $f = Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config"
          if (-not $f.canSave -or -not $f.text) { Stop-Process -Id $p.Id -Force; throw "ui_config.json not served as editable" }
          $body = @{ text = $f.text; baseModified = $f.modified } | ConvertTo-Json
          $s = Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config" -Method Put -Body $body -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }
          $stale = @{ text = $f.text; baseModified = 1 } | ConvertTo-Json
          try { Invoke-RestMethod "http://127.0.0.1:18080/api/ui-config" -Method Put -Body $stale -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }; $conflict = $false }
          catch { $conflict = $_.Exception.Response.StatusCode.value__ -eq 409 }
          # project folder: Save writes <project>_v<version>.json to ..\..\configurations\project_configuration
          $cfg = @{ text = '{"project":{"project":"sample","version":"V.1.0.0"}}' } | ConvertTo-Json
          $saved = Invoke-RestMethod "http://127.0.0.1:18080/api/files/project/sample_v1.0.0.json" -Method Put -Body $cfg -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }
          $list = Invoke-RestMethod "http://127.0.0.1:18080/api/files/project"
          try { Invoke-RestMethod "http://127.0.0.1:18080/api/files/project/sample_v1.0.0.json" -Method Put -Body $cfg -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }; $kept = $false }
          catch { $kept = $_.Exception.Response.StatusCode.value__ -eq 409 }
          # tester folders: bit files are listed, never written
          New-Item -ItemType Directory -Force fpga_bitfile | Out-Null
          Set-Content fpga_bitfile\FPGA_4IN4OUT_NI1487_Universal_v10.0.0.lvbitx "x"
          $bits = Invoke-RestMethod "http://127.0.0.1:18080/api/files/bitfile"
          New-Item -ItemType Directory -Force configurations\i2c_configuration | Out-Null
          Set-Content configurations\i2c_configuration\front_init.txt "0x40 0x01"
          $i2c = Invoke-RestMethod "http://127.0.0.1:18080/api/files/i2c"
          try { Invoke-RestMethod "http://127.0.0.1:18080/api/files/bitfile/x.lvbitx" -Method Put -Body $cfg -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }; $bitWritable = $true }
          catch { $bitWritable = $false }
          $tst = @{ text = '{"tester":{"testerName":"HIL","version":"V.1.0.0","project":"sample_v1.0.0.json","modes":[]}}' } | ConvertTo-Json
          $tsaved = Invoke-RestMethod "http://127.0.0.1:18080/api/files/tester/HIL_v1.0.0.json" -Method Put -Body $tst -ContentType "application/json" -Headers @{ "X-Vision-Studio" = "1" }
          Stop-Process -Id $p.Id -Force
          if ($bits.files.name -notcontains "FPGA_4IN4OUT_NI1487_Universal_v10.0.0.lvbitx") { throw "bit file folder not listed" }
          if ($bitWritable) { throw "the bit file folder must be read-only" }
          if ($i2c.files.name -notcontains "front_init.txt") { throw "I2C configuration folder not listed" }
          if (-not (Test-Path "configurations\tester_configuration\HIL_v1.0.0.json")) { throw "tester configuration not saved ($($tsaved.path))" }
          Write-Host "tester folders ok ($($tsaved.path))"
          $expected = Join-Path (Resolve-Path ".") "configurations\project_configuration\sample_v1.0.0.json"
          if (-not (Test-Path $expected)) { throw "configuration not saved to $expected (got $($saved.path))" }
          if ($list.files.name -notcontains "sample_v1.0.0.json") { throw "project folder listing is missing the saved file" }
          if (-not $kept) { throw "an existing configuration was replaced without overwrite" }
          Write-Host "project folder ok ($($saved.path))"
          if (-not $conflict) { throw "stale save was not rejected" }
          Write-Host "ui_config API ok ($($s.path))"
      - uses: actions/upload-artifact@v4
        with:
          name: VisionStudio-portable
          path: |
            release/VisionStudio/VisionStudio.exe
            release/VisionStudio/VisionStudio.ini
            release/VisionStudio/ui_config.json
            release/VisionStudio/README.txt
